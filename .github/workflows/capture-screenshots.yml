name: Capture Screenshots

on:
  workflow_dispatch:
  # Run a few minutes after the daily sync so repos.json is fresh.
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run capture script
        run: node scripts/capture-screenshots.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos.json public/projects
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh screenshots [automated]"
          git push